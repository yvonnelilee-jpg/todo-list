<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0e0d" />
    <!-- Match src/theme.js: day window + THEME_PREFERENCE_STORAGE_KEY -->
    <script>
      ;(function () {
        var S = 7,
          E = 19
        var KEY = 'task-notebook-theme-preference'
        var h = new Date().getHours()
        var clockLight = h >= S && h < E
        var pref = null
        try {
          pref = localStorage.getItem(KEY)
        } catch (e) {}
        var light =
          pref === 'light' ? true : pref === 'dark' ? false : clockLight
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        if (pref === 'light' || pref === 'dark' || pref === 'auto')
          document.documentElement.dataset.themePreference = pref
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', light ? '#0f0e0d' : '#1e1c18')
      })()
    </script>
    <title>Task Notebook</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app"></div>

    <template id="todo-item-template">
      <li class="todo-item" data-todo-id="">
        <span
          class="todo-drag-handle"
          draggable="true"
          role="button"
          tabindex="0"
          aria-grabbed="false"
        >
          <svg
            class="todo-drag-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="9" cy="8" r="1.5" fill="currentColor" />
            <circle cx="15" cy="8" r="1.5" fill="currentColor" />
            <circle cx="9" cy="12" r="1.5" fill="currentColor" />
            <circle cx="15" cy="12" r="1.5" fill="currentColor" />
            <circle cx="9" cy="16" r="1.5" fill="currentColor" />
            <circle cx="15" cy="16" r="1.5" fill="currentColor" />
          </svg>
        </span>
        <label class="todo-row">
          <input class="todo-checkbox" type="checkbox" />
          <span class="todo-body">
            <span class="todo-title"></span>
            <time class="todo-time"></time>
          </span>
        </label>
        <button type="button" class="todo-add-subtask" title="Add sub-task">
          <span class="sr-only">Add sub-task</span>
          <svg
            class="todo-add-subtask-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M11 19v-6H5v-2h6V5h2v6h6v2h-6v6h-2z"
            />
          </svg>
        </button>
        <button type="button" class="todo-delete">
          <span class="sr-only">Delete task</span>
          <svg
            class="todo-delete-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              fill-rule="evenodd"
              d="M16 7h5v2h-2v12a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V9H3V7h5V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1zm-8 0h8V6h-8v1zM6 9v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9H6zm3 2h2v8H9v-8zm4 0h2v8h-2v-8z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </li>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
